version: "3.9" # Asegúrate de usar una versión compatible con Docker Stack

services:
  proxy:
    image: proxy:latest  # Asegúrate de construir y etiquetar la imagen previamente
    deploy:
      replicas: 3  # Número de instancias del servicio
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
    ports:
      - "80:80"
    depends_on:
      - user-auth
      - bus-reservation
      - payment-gateway
      - route-scheduler
    networks:
      - app-network

  user-auth:
    image: user-auth:latest  # Construye y etiqueta la imagen previamente
    deploy:
      replicas: 3
    ports:
      - "5001:5001"
    networks:
      - app-network

  bus-reservation:
    image: bus-reservation:latest  # Construye y etiqueta la imagen previamente
    deploy:
      replicas: 3
    ports:
      - "5002:5002"
    networks:
      - app-network

  payment-gateway:
    image: payment-gateway:latest  # Construye y etiqueta la imagen previamente
    deploy:
      replicas: 3
    ports:
      - "5003:5003"
    networks:
      - app-network

  route-scheduler:
    image: route-scheduler:latest  # Construye y etiqueta la imagen previamente
    deploy:
      replicas: 3
    ports:
      - "5004:5004"
    networks:
      - app-network

networks:
  app-network:
    driver: overlay  # Docker Stack usa redes overlay